# Retina Node - Passive Radar Stack
#
# Works for both standalone and Mender-managed deployments.
# - Mender (default): Just run `docker compose up -d` - config-merger runs automatically
# - Standalone: Provide .env with SKIP_CONFIG_MERGER=true and path overrides
#
# See .env.example for standalone configuration.
#
# Releases: Update the version after :- in each image tag (e.g., :-v0.3.0 → :-v0.4.0)
#   BLAH2_V, TAR1090_V, ADSB2DD_V, CONFIG_MERGER_V, RETINA_TRACKER_V

networks:
  blah2:
    driver: bridge

services:

  config-merger:
    restart: "no"  # Run once and exit
    image: ghcr.io/offworldlabs/retina-config-merger:${CONFIG_MERGER_V:-v0.4.4.0}
    volumes:
      - ${CONFIG_DIR:-/data/retina-node/config}:/data/retina-node/config
      - ${MENDER_COMPOSE_DIR:-/data/mender-docker-compose}:/data/mender-docker-compose
      - ${MENDER_DATA_DIR:-/data/mender}:/data/mender:ro
    container_name: retina-config-merger
    # Skip config-merger for standalone deployments (set SKIP_CONFIG_MERGER=true in .env)
    command: >
      sh -c "
        if [ '${SKIP_CONFIG_MERGER:-false}' = 'true' ]; then
          echo 'Config merger skipped (standalone mode)';
          exit 0;
        fi;
        python3 /usr/local/bin/merge_config.py /config/defaults /data/retina-node/config/user.yml /data/retina-node/config/config.yml
      "

  blah2:
    restart: always
    image: ghcr.io/offworldlabs/blah2:${BLAH2_V:-v0.4.2}
    tty: true
    depends_on:
      config-merger:
        condition: service_completed_successfully
      blah2_api:
        condition: service_started
    environment:
      - BLAH2_VERBOSE=false
    volumes:
      - ${CONFIG_DIR:-/data/retina-node/config}:/opt/blah2/config:ro
      - ${DATA_DIR:-/data/retina-node}/blah2/save:/opt/blah2/save
      - /dev/shm:/dev/shm:rw
      - /dev/bus/usb:/dev/bus/usb:rw
      - /usr/local/lib/libsdrplay_api.so.3.15:/usr/local/lib/libsdrplay_api.so.3:ro
      - ${DATA_DIR:-/data/retina-node}/blah2/test:/opt/blah2/test
    network_mode: host
    pid: "host"
    privileged: true  # Required for USB SDR access
    command: bash -c "/opt/blah2/sdrplay-restart.sh && /opt/blah2/bin/blah2 -c /opt/blah2/config/config.yml"
    container_name: blah2

  blah2_web:
    restart: always
    image: ghcr.io/offworldlabs/blah2-web:${BLAH2_V:-v0.4.2}
    ports:
      - "${BLAH2_WEB_PORT:-49152}:80"
    networks:
      - blah2
    container_name: blah2-web

  blah2_api:
    restart: always
    image: ghcr.io/offworldlabs/blah2-api:${BLAH2_V:-v0.4.2}
    depends_on:
      config-merger:
        condition: service_completed_successfully
    volumes:
      - ${CONFIG_DIR:-/data/retina-node/config}:/usr/src/app/config:ro
    network_mode: host
    command: node server.js /usr/src/app/config/config.yml
    container_name: blah2-api

  blah2_host:
    restart: always
    image: ghcr.io/offworldlabs/blah2-host:${BLAH2_V:-v0.4.2}
    ports:
      - "${BLAH2_HOST_PORT:-8080}:80"
    networks:
      - blah2
    container_name: blah2-host
    depends_on:
      - blah2_web
      - blah2_api

  tar1090:
    restart: always
    image: ghcr.io/offworldlabs/tar1090-node:${TAR1090_V:-v0.2.0}
    container_name: tar1090
    hostname: tar1090
    ports:
      - "${TAR1090_PORT:-8078}:80"
    networks:
      - blah2
    depends_on:
      config-merger:
        condition: service_completed_successfully
    environment:
      - TZ=${TZ:-UTC}
      # readsb config
      - READSB_DEVICE_TYPE=none
      - READSB_NET_ENABLE=true
      - READSB_NET_CONNECTOR=${READSB_NET_CONNECTOR:-}
      - READSB_LAT=${RECEIVER_LAT:-0}
      - READSB_LON=${RECEIVER_LON:-0}
      - READSB_ALT=${RECEIVER_ALT:-0}
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      # tar1090 map config
      - LAT=${RECEIVER_LAT:-0}
      - LONG=${RECEIVER_LON:-0}
      - TAR1090_DEFAULTCENTERLAT=${RECEIVER_LAT:-0}
      - TAR1090_DEFAULTCENTERLON=${RECEIVER_LON:-0}
      # adsb.lol proxy config
      - ADSBLOL_ENABLED=${ADSBLOL_ENABLED:-false}
      - RECEIVER_LAT=${RECEIVER_LAT:-0}
      - RECEIVER_LON=${RECEIVER_LON:-0}
      - ADSBLOL_RADIUS=${ADSBLOL_RADIUS:-40}
      - PROXY_PORT=3005
      # SD-card endurance: run the graphs1090 RRD set from the /run tmpfs below
      # and write it back as a single gzipped tarball, instead of 48 scattered
      # in-place RRD updates every 60s. Only effective because /run is tmpfs.
      - GRAPHS1090_REDUCE_IO=true
    tmpfs:
      # /run holds volatile runtime state (readsb JSON at 1 Hz, tar1090 chunks,
      # graphs1090 PNGs, s6 service dirs) and is tmpfs on any normal install.
      # On the container overlay it cost ~7 GB/day of SD-card writes for ~8 KB/min
      # of real data. exec is required: s6-overlay execs its service scripts here.
      - /run:exec,size=64M
      - /var/log:size=32M

  adsb2dd:
    restart: always
    image: ghcr.io/offworldlabs/adsb2dd:${ADSB2DD_V:-v0.1.3}
    network_mode: host
    container_name: adsb2dd
    environment:
      - TZ=${TZ:-UTC}

  retina-spectrum:
    profiles: [spectrum]
    restart: "no"
    image: ghcr.io/offworldlabs/retina-spectrum:${SPECTRUM_V:-v0.1.1}
    network_mode: host
    # Pinned for the same reason as retina-telemetry: this resolves
    # tower-finder.retina.fm, so it must not depend on the host's resolv.conf
    # having been correct at the instant the container happened to be created.
    dns:
      - ${NODE_DNS_1:-1.1.1.1}
      - ${NODE_DNS_2:-8.8.8.8}
      - ${NODE_DNS_3:-2606:4700:4700::1111}
    pid: "host"
    privileged: true
    environment:
      - TOWER_FINDER_URL=${TOWER_FINDER_URL:-https://tower-finder.retina.fm}
    volumes:
      - /dev/shm:/dev/shm:rw
      - /dev/bus/usb:/dev/bus/usb:rw
      - /usr/local/lib/libsdrplay_api.so.3.15:/usr/local/lib/libsdrplay_api.so.3:ro
    command: bash -c "pkill -9 -f sdrplay_apiService 2>/dev/null || true && sleep 2 && retina-spectrum --web-dir /web"
    container_name: retina-spectrum

  retina-tracker:
    restart: always
    image: ghcr.io/offworldlabs/retina-tracker:${RETINA_TRACKER_V:-v0.2.1}
    network_mode: host
    depends_on:
      config-merger:
        condition: service_completed_successfully
    # --tcp-host 127.0.0.1 (not the image's 0.0.0.0 default): network_mode
    # host means 0.0.0.0 would bind the real host interface, exposing the
    # ingest port to the LAN. retina-gui is always colocated on this same
    # host, so loopback-only is sufficient.
    command: >
      python -m retina_tracker.track_detections
      --tcp --tcp-host 127.0.0.1 --tcp-port 30100
      -s /app/output/events.jsonl
      -c /config/retina-tracker.yaml
      --blah2-config /config/config.yml
    volumes:
      - ${DATA_DIR:-/data/retina-node}/retina-tracker/output:/app/output
      - ${CONFIG_DIR:-/data/retina-node/config}:/config:ro
    container_name: retina-tracker

  retina-telemetry:
    restart: always
    image: ghcr.io/offworldlabs/retina-telemetry:${TELEMETRY_V:-v0.1.0}
    # network_mode: host to reach blah2_api on 127.0.0.1:3000. It binds no
    # listening ports of its own — every input here is a poll or a file read.
    network_mode: host
    # Pinned resolvers rather than the host's. Docker copies the host's
    # /etc/resolv.conf into a container once, at creation, and never refreshes
    # it: not on restart, not on reboot. A container created while that file was
    # still wrong therefore stays wrong for its entire life. That is what
    # stranded five boards in August 2026. They ran blah2, collected detections
    # and reported active while resolving nothing, because their telemetry
    # container was created in the seconds before NetworkManager wrote a usable
    # resolv.conf. Setting dns here makes Docker write the file from these
    # values and ignore the host's copy entirely, so creation timing stops
    # mattering. Docker confirms it in the file it writes, as "Overrides:
    # [nameservers]".
    #
    # NODE_DNS_* can be set in .env for standalone deployments. On a Mender
    # node it cannot, yet: config-merger rewrites the manifests .env wholesale
    # on every run, so a value added there by hand is lost at the next config
    # merge. A site that blocks outbound DNS to public resolvers therefore
    # needs config-merger taught to emit these before the override is usable.
    dns:
      - ${NODE_DNS_1:-1.1.1.1}
      - ${NODE_DNS_2:-8.8.8.8}
      - ${NODE_DNS_3:-2606:4700:4700::1111}
    # No depends_on, unlike every other service. This is the one that must keep
    # reporting while the rest of the stack is crash-looping, which is the whole
    # point of it: gating it on config-merger would leave it dead exactly when
    # its telemetry matters most. It re-reads its inputs on every cycle, so
    # config that appears later is picked up without a restart.
    volumes:
      # Identity: node_id and device_type. node_id comes from here and nowhere
      # else — it is never derived — and these files are 0600 root-owned, which
      # is the only reason this container runs as root.
      - ${MENDER_DATA_DIR:-/data/mender}:/data/mender:ro
      - ${CONFIG_DIR:-/data/retina-node/config}:/data/retina-node/config:ro
      # retina-gui's device state, for the telemetry consent record. Read-only:
      # retina-gui writes it, we only ever read. Needs retina-gui >= v0.7.0,
      # which is the first version that persists the three records; without
      # them a node refuses to register, deliberately.
      - ${GUI_DATA_DIR:-/data/retina-gui}:/data/retina-gui:ro
      # The only writable mount. Holds the bearer token at 0600 and the status
      # document at 0644, under /data so the token survives an OS update.
      # Losing it means re-registering, which needs an operator to reactivate
      # the node — the server returns one opaque 403 for every refusal.
      - ${TELEMETRY_DATA_DIR:-/data/retina-telemetry}:/data/retina-telemetry
    # No docker socket. blah2 and ADS-B liveness are derived from the detection
    # poll, which distinguishes down from wedged where container state cannot,
    # and versions come from the image tags below.
    environment:
      # host.py would otherwise default to /data, which is not mounted — only
      # its subdirectories are — so statvfs would measure this container's
      # overlay instead of the node's storage and disk_free_mb would be
      # fiction. /data/mender is mounted, read-only, and on the same filesystem.
      - DISK_PATH=/data/mender
      # Image tags, so `versions` in the heartbeat reports something true.
      # RETINA_NODE_V has no source on a node yet; it is passed so it starts
      # working the moment owl-os provides one.
      - BLAH2_V=${BLAH2_V:-v0.4.2}
      - OWL_OS_V=${OWL_OS_V:-}
      - RETINA_NODE_V=${RETINA_NODE_V:-}
      - LOG_LEVEL=${TELEMETRY_LOG_LEVEL:-INFO}
    container_name: retina-telemetry
