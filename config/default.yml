capture:
  fs: 2000000
  fc: 503000000
  device:
    type: "RspDuo"
    agcSetPoint: -60
    bandwidthNumber: 0
    gainReduction: [40, 40] #20-59 dB each, [reference, surveillance], higher is less gain
    lnaState: 4 #1-9, higher is more gain
    dabNotch: true
    rfNotch: true
  replay:
    state: false
    loop: true
    file: '/opt/blah2/replay/file.rspduo'

process:
  data:
    cpi: 0.5
    buffer: 1.5
    overlap: 0
  ambiguity:
    delayMin: -10
    delayMax: 400
    dopplerMin: -200
    dopplerMax: 200
  clutter:
    enable: true
    delayMin: -10
    delayMax: 400
  detection:
    enable: true
    pfa: 0.00001
    nGuard: 2
    nTrain: 6
    minDelay: 5
    minDoppler: 15
    nCentroid: 6
  tracker:
    # blah2's own built-in tracker - superseded by the retina-tracker sidecar
    # (see retina_tracker below), which is what's actually used. Left disabled
    # so nothing runs its associate/promote loop or feeds its unused
    # blah2-api /api/tracker endpoint.
    enable: false
    initiate:
      M: 3
      N: 5
      maxAcc: 10
    delete: 10
    smooth: "none"

network:
  ip: 0.0.0.0
  ports:
    api: 3000
    map: 3001
    detection: 3002
    track: 3003
    timestamp: 4000
    timing: 4001
    iqdata: 4002
    config: 4003

  node_id: "ret000000000"

  # Forward detections to external tracker container
  tracker_forward:
    enabled: false
    host: 'blah2_tracker'
    port: 3012

truth:
  adsb:
    enabled: true
    tar1090: 'sfo1.retnode.com'
    adsb2dd: 'localhost:49155'
    delay_tolerance: 2.0
    doppler_tolerance: 5.0
  ais:
    enabled: false
    ip: 0.0.0.0
    port: 30001

# Null until an owner picks a tower. This shipped as Greenwich Observatory /
# Crystal Palace, which is indistinguishable downstream from a real choice, so
# every consumer treated an unconfigured node as a configured one and nodes
# registered with the server claiming to be in south-east London.
#
# Keys kept, with null values, rather than removed: consumers need to tell
# "unset" from "absent because this config is malformed", and retina-gui's
# config form renders from these keys.
#
# Set by retina-gui's tower step (/towers/select), which writes rx, tx and
# capture.fc together into user.yml.
location:
  rx:
    latitude: null
    longitude: null
    altitude: null
    name: null
  tx:
    latitude: null
    longitude: null
    altitude: null
    name: null

save:
  iq: false
  map: false
  detection: false
  timing: false
  path: "/opt/blah2/save/"

# tar1090-node configuration
# Note: tar1090 uses location.rx for receiver position (no separate tar1090.location needed)
tar1090:
  adsb_source: ""  # Optional local ADS-B receiver (IP,PORT,PROTOCOL). Empty = rely on adsblol_fallback.
  adsblol_fallback: true
  adsblol_radius: 40

# retina-tracker sidecar (github.com/offworldlabs/retina-tracker) config.
# Unrelated to process.tracker above, which is blah2's own built-in tracker.
retina_tracker:
  # dB. Detections below this are discarded before tracking even begins -
  # too high and the tracker silently never confirms a track no matter how
  # good the search geometry is. Tune to this node's real noise floor
  # (compare against SNR values from blah2_api's /api/detection).
  min_snr: 7.0
