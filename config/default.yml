capture:
  fs: 2000000
  fc: 503000000
  device:
    type: "RspDuo"
    agcSetPoint: -60
    bandwidthNumber: 0
    gainReduction: [40, 40] #20-59 dB each, [reference, surveillance], higher is less gain
    lnaState: 4 #1-9, higher is more gain
    dabNotch: true
    rfNotch: true
  replay:
    state: false
    loop: true
    file: '/opt/blah2/replay/file.rspduo'

process:
  data:
    cpi: 0.5
    buffer: 1.5
    overlap: 0
  ambiguity:
    delayMin: -10
    delayMax: 400
    dopplerMin: -300
    dopplerMax: 300
  clutter:
    enable: true
    delayMin: -10
    delayMax: 400
  detection:
    enable: true
    pfa: 0.00001
    nGuard: 2
    nTrain: 6
    minDelay: 5
    minDoppler: 15
    nCentroid: 6

network:
  ip: 0.0.0.0
  ports:
    api: 3000
    map: 3001
    detection: 3002
    timestamp: 4000
    timing: 4001
    iqdata: 4002
    config: 4003

  # Placeholder only. config-merger overwrites this with the real value from
  # /data/mender/node_id on every merge, and nothing derives an identity from
  # node config. It deliberately does not look like a node id: the old
  # "ret000000000" was close enough to a real one to be mistaken for a live
  # node in a config dump, and matches neither the ret<8 hex> nor the
  # retg<15 hex> format.
  node_id: "unset"

  # Forward detections to the retina-tracker sidecar. blah2_api enriches each
  # frame with ADS-B truth before forwarding, so the tracker gets the annotated
  # frame rather than the bare one, which is where a track's adsb_hex comes from.
  #
  # 127.0.0.1 rather than a container name: retina-tracker runs with
  # network_mode host and binds loopback only (--tcp-host 127.0.0.1), and
  # blah2_api is on the same host network. The default 'blah2_tracker:3012'
  # names a container from blah2's own compose, which does not exist here.
  #
  # This must stay in step with retina-gui: the tracker's ingest socket accepts
  # one connection at a time, so exactly one process may feed it. retina-gui
  # stopped forwarding in the same release that turned this on.
  tracker_forward:
    enabled: true
    host: '127.0.0.1'
    port: 30100

truth:
  adsb:
    enabled: true
    # The node's own tar1090 container, which every node runs on the same port.
    # Node-invariant on purpose: a local receiver is described by tar1090.adsb_source
    # below and merged in there, so adding one never means editing this. Pointing
    # this at a receiver directly is the mistake it is shaped to prevent, because
    # a receiver's raw feed port speaks BEAST and this is fetched over HTTP.
    tar1090: 'localhost:8078'
    adsb2dd: 'localhost:49155'
    delay_tolerance: 2.0
    doppler_tolerance: 5.0
  ais:
    enabled: false
    ip: 0.0.0.0
    port: 30001

# Null until an owner picks a tower. This shipped as Greenwich Observatory /
# Crystal Palace, which is indistinguishable downstream from a real choice, so
# every consumer treated an unconfigured node as a configured one and nodes
# registered with the server claiming to be in south-east London.
#
# Keys kept, with null values, rather than removed: consumers need to tell
# "unset" from "absent because this config is malformed", and retina-gui's
# config form renders from these keys.
#
# Set by retina-gui's tower step (/towers/select), which writes rx, tx and
# capture.fc together into user.yml.
location:
  rx:
    latitude: null
    longitude: null
    altitude: null
    name: null
  tx:
    latitude: null
    longitude: null
    altitude: null
    name: null

save:
  iq: false
  map: false
  detection: false
  timing: false
  path: "/opt/blah2/save/"

# tar1090-node configuration
# Note: tar1090 uses location.rx for receiver position (no separate tar1090.location needed)
tar1090:
  adsb_source: ""  # Optional local ADS-B receiver (IP,PORT,PROTOCOL). Empty = rely on adsblol_fallback.
  adsblol_fallback: true
  adsblol_radius: 40

# retina-tracker sidecar (github.com/offworldlabs/retina-tracker) config.
# blah2 has no built-in tracker of its own; this sidecar does all tracking.
retina_tracker:
  # dB. Detections below this are discarded before tracking even begins -
  # too high and the tracker silently never confirms a track no matter how
  # good the search geometry is. Tune to this node's real noise floor
  # (compare against SNR values from blah2_api's /api/detection).
  min_snr: 7.0
